[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dws-trade-analytics"
version = "0.1.0"
description = "Frankfurter FX ingestion, Bronze-to-Silver trade processing and Streamlit analytics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2,<3",
    "fastapi>=0.115,<0.116",
    "httpx>=0.27,<0.28",
    "uvicorn[standard]>=0.30,<1",
    "pyarrow>=18,<24",
    "streamlit>=1.50,<1.51",
    "plotly>=6,<7",
]

[project.scripts]
trade-transform = "data_pipeline.data_pipeline:main"
trade-api-usd-exchange-rates = "data_pipeline.fx_api:main"
trade = "data_pipeline.cli:main"
trade-dashboard = "Dashboard.cli:main"

[tool.setuptools]
packages = ["data_pipeline", "Dashboard"]
include-package-data = false

[tool.setuptools.package-data]
Dashboard = [".streamlit/config.toml"]
